# Fleet library CI (fleet-standard templates/library/public), fleet-workflows v0.0.2, stack node.
#   lint   Biome, tsc, actionlint, zizmor
#   unit   the Playwright image guard (node --test); no library code, so no coverage floor
#   e2e    dispatch only (CI-E2E-01): the synthwerk-infra stack (profile vision) plus
#          stack/compose.e2e.yaml and a synthwerk-widgets build, then the journeys in the
#          Playwright image (pinned by digest). infra-ref and widgets-ref pick the commits under
#          test: a branch, a tag or a full SHA; main by default
#   build  nothing to build: the journeys run from source (fleet.yml CI-BUILD-04)
# Required check of the ruleset "main: checks required": conclusion.
name: ci

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the e2e stage
        type: boolean
        default: false
      infra-ref:
        description: synthwerk-infra commit to run the stack from (branch, tag or full SHA)
        type: string
        default: main
      widgets-ref:
        description: synthwerk-widgets commit to build the widgets from (branch, tag or full SHA)
        type: string
        default: main

permissions: {}

defaults:
  run:
    shell: bash

# A PR run has its own group (the PR number). A dispatch shares the group of its branch, so only
# a newer dispatch of the same branch cancels it: the newest run wins (CI-COST-06).
# `shell: bash` runs `bash --noprofile --norc -eo pipefail {0}`.
concurrency:
  group: ci-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - name: Detect code changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.github/ISSUE_TEMPLATE/**'

  lint:
    needs: changes
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-lint.yml@v0.0.2
    with:
      stack: node

  unit:
    needs: [changes, lint]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-unit.yml@v0.0.2
    with:
      stack: node
      command: pnpm test:guard
      # The guard reads files; there is no library code to cover (fleet.yml CI-UNIT-03).
      coverage-floor: 0

  # The refs go into the e2e command text, so check them first: a branch, tag or SHA name only,
  # nothing a shell reads as code. The command uses these outputs, never the raw inputs.
  refs:
    needs: [changes, unit]
    if: ${{ !failure() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      infra: ${{ steps.check.outputs.infra }}
      widgets: ${{ steps.check.outputs.widgets }}
    steps:
      - name: Check the refs under test
        id: check
        env:
          INFRA_REF: ${{ inputs.infra-ref }}
          WIDGETS_REF: ${{ inputs.widgets-ref }}
        run: |
          for ref in "$INFRA_REF" "$WIDGETS_REF"; do
            if ! [[ "$ref" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ ]] || [[ "$ref" == *..* ]]; then
              echo "::error::not a branch, tag or SHA: $ref"; exit 1
            fi
          done
          echo "infra=$INFRA_REF" >> "$GITHUB_OUTPUT"
          echo "widgets=$WIDGETS_REF" >> "$GITHUB_OUTPUT"

  # Fleet rule CI-E2E-01: e2e never runs on a PR, a push or a schedule; only by dispatch of
  # this workflow with e2e: true (or in a promotion preflight). The journeys are the product of
  # this repo, so run them by hand before a merge that changes them: Actions > ci > Run workflow.
  e2e:
    needs: [changes, unit, refs]
    if: ${{ !failure() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.e2e }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-e2e.yml@v0.0.2
    with:
      stack: node
      # Bring up the infra stack (profile vision) with the e2e overlay, build the widgets
      # under test, copy the Zitadel secrets out, then run the journeys in the pinned
      # Playwright image. JUnit goes to e2e-junit.xml (CI-E2E-05). fetch takes a branch, a
      # tag or a full SHA (GitHub serves a commit by SHA); the summary names the commits.
      command: |
        export E2E_ZITADEL_API_PORT=8090 COMPOSE_PROFILES=vision
        checkout() {
          git init -q "$2" && git -C "$2" fetch -q --depth 1 "https://github.com/VelimirMueller/$1.git" "$3"
          git -C "$2" checkout -q --detach FETCH_HEAD
          echo "$1 $3 = $(git -C "$2" rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
        }
        checkout synthwerk-infra infra '${{ needs.refs.outputs.infra }}'
        checkout synthwerk-widgets widgets '${{ needs.refs.outputs.widgets }}'
        (cd widgets && npx --yes pnpm@12.15.0 install --frozen-lockfile && npx --yes pnpm@12.15.0 build)
        infra/scripts/init-env.sh
        compose() { docker compose --project-directory infra -f infra/compose.yaml -f stack/compose.e2e.yaml "$@"; }
        trap 'status=$?; if [ "$status" -ne 0 ]; then compose logs --no-color --tail 150; fi; compose down --volumes; exit "$status"' EXIT
        compose up --build --wait --wait-timeout 600
        scripts/stack-secrets.sh synthwerk
        # Zitadel access tokens carry the project id as audience, never synthwerk-api: the
        # journeys sign in for real, so identity (widget token trade, apps) and llm take it.
        aud="$(jq -r .project_id .stack/studio-client.json)"
        SYNTHWERK_IDENTITY_OIDC_AUDIENCE="$aud" SYNTHWERK_LLM_OIDC_AUDIENCE="$aud" compose up -d --wait identity llm
        docker run --rm --network host --ipc=host -e CI=1 \
          -e PLAYWRIGHT_JUNIT_OUTPUT_FILE=e2e-junit.xml -e E2E_WIDGETS_DIST=/work/widgets/dist \
          -v "$PWD:/work" -w /work --user "$(id -u):$(id -g)" -e HOME=/tmp \
          mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf \
          node_modules/.bin/playwright test --reporter=list,junit

  build:
    needs: [changes, e2e]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-build.yml@v0.0.2
    with:
      stack: generic
      command: echo "Nothing to build, the journeys run from source (fleet.yml exception CI-BUILD-04)."
      pack: false

  # A skipped job counts as success only when the stage is not required: when code changed,
  # lint, unit and build must be success; a dispatch with e2e: true also needs e2e success.
  # A docs-only PR skips the stages on purpose (CI-COST-16).
  conclusion:
    needs: [changes, lint, unit, refs, e2e, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a job failed or a required stage was skipped
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          LINT: ${{ needs.lint.result }}
          UNIT: ${{ needs.unit.result }}
          BUILD: ${{ needs.build.result }}
          E2E: ${{ needs.e2e.result }}
          WANT_E2E: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a job ended as $r"; exit 1 ;; esac
          done
          if [ "$CODE" = "true" ]; then
            for r in "$LINT" "$UNIT" "$BUILD"; do
              [ "$r" = "success" ] || { echo "::error::a required stage did not run"; exit 1; }
            done
          fi
          if [ "$WANT_E2E" = "true" ] && [ "$E2E" != "success" ]; then
            echo "::error::e2e was requested but ended as $E2E"; exit 1
          fi
